# if all 3 coord sources say the same country, try and find the center source
# unless they are lower than this long/lat degree threshold
coord_spread_threshold: 2
coord_priority:
  - ip2location
  - dbip
  - geolite2

# when only two coord sources have a city-level point and they are further apart
# than coord_spread_threshold there is no center to pick, so this order decides
coord_tiebreak:
  - dbip
  - ip2location
  - geolite2

# country voting tiebreak order
vote_priority:
  - ip2location
  - geo-whois-asn-country
  - dbip
  - geolite2
  - ipinfo-country
  - iplocate-country

# source pairs that force a country win before voting
# overrides:
#   - match: [ip2location, geo-whois-asn-country]
